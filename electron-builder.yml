appId: app.streamhelper
productName: StreamHelper
publish:
  provider: github
  owner: Rayness
  repo: StreamHelper-Releases
  releaseType: release
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - src/main/winrt/generated/**
  - package.json
extraResources:
  - from: resources/overlays
    to: overlays
  - from: resources/icon.png
    to: icon.png
asarUnpack:
  - resources/**
  - '**/*.node'
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: StreamHelper
  artifactName: StreamHelper-Setup-${version}.${ext}
