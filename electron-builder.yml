appId: app.streamhelper
productName: StreamHelper
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources/overlays
    to: overlays
  - from: resources/icon.png
    to: icon.png
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: StreamHelper
  artifactName: StreamHelper-Setup-${version}.${ext}
