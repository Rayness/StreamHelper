<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>StreamHelper — Chat Spotlight</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Inter,'Segoe UI',sans-serif;color:#fff}#card{box-sizing:border-box;margin:20px;width:calc(100% - 40px);height:calc(100% - 40px);padding:24px 30px;border-radius:22px;background:#17131fed;border:1px solid #ffffff35;box-shadow:0 15px 40px #0009;opacity:0;transform:translateY(18px);transition:opacity .35s,transform .35s;display:flex;flex-direction:column;justify-content:center}#card.show{opacity:1;transform:none}#name{font-size:23px;font-weight:800;color:#bd96ff;margin-bottom:12px}#text{font-size:30px;font-weight:650;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow-wrap:anywhere}</style></head><body><div id="card"><div id="name"></div><div id="text"></div></div><script src="/overlay/assets/common.js"></script><script>
const card=document.getElementById('card');SH.connect('spotlight',m=>{if(m.type!=='spotlight')return;const x=m.message;if(!x&&!SH.preview){card.classList.remove('show');return}document.getElementById('name').textContent=x?.userName||'Viewer';document.getElementById('text').textContent=x?.text||'Выделенное сообщение появится здесь';document.getElementById('name').style.color=x?.color||'#bd96ff';card.classList.add('show')});
</script></body></html>
