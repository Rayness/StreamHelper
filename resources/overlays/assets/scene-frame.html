<!doctype html><html><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><style>html,body{margin:0;background:transparent}</style></head><body><script>
// Separate HTTP document: custom scripts never inherit the Electron editor's CSP or preload.
addEventListener('message', (event) => {
  if (event.source !== parent || event.data?.type !== 'scene:load' || typeof event.data.document !== 'string' || event.data.document.length > 2_000_000) return;
  document.open(); document.write(event.data.document); document.close();
});
parent.postMessage({type:'scene:frame-ready'}, '*');
</script></body></html>
