<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>StreamHelper — Chat Boss</title>
<style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Montserrat,'Segoe UI',sans-serif;color:#fff}#root{box-sizing:border-box;padding:25px;width:100%;height:100%;display:flex;align-items:center}#card{width:100%;background:#17131fe8;border:1px solid #ffffff30;border-radius:20px;padding:22px 28px;box-shadow:0 14px 40px #0008}header{display:flex;justify-content:space-between;align-items:baseline;gap:20px}h1{margin:0;font-size:32px}#hp{font-size:24px;font-weight:800}#bar{height:28px;background:#ffffff26;border-radius:20px;overflow:hidden;margin-top:15px}#fill{height:100%;width:100%;background:linear-gradient(90deg,var(--accent),#ffc467);border-radius:20px;transition:width .4s}footer{display:flex;justify-content:space-between;font-size:19px;color:#d2c8db;margin-top:14px}.defeated #fill{background:#5fe0a1}.hit{animation:hit .25s}@keyframes hit{50%{transform:translateX(8px)}} </style></head><body><div id="root"><div id="card"><header><h1 id="name"></h1><span id="hp"></span></header><div id="bar"><div id="fill"></div></div><footer><span id="help"></span><span id="last"></span></footer></div></div><script src="/overlay/assets/common.js"></script><script>
const $=id=>document.getElementById(id);let hits=0;function render(m){const b=m.boss,s=m.style,ru=m.lang==='ru';if(b.status==='idle'&&!SH.preview){$('root').style.display='none';return}const maxHp=b.maxHp||s.maxHp,hp=b.status==='idle'?maxHp:b.hp;$('root').style.display='flex';SH.useFont(document.body,s.fontFamily||'Montserrat');$('card').style.setProperty('--accent',s.accentColor);$('card').classList.toggle('defeated',b.status==='defeated');$('name').textContent=s.name;$('hp').textContent=`${hp} / ${maxHp} HP`;$('fill').style.width=(maxHp?Math.max(0,hp/maxHp*100):100)+'%';$('help').textContent=b.status==='defeated'?(ru?'Победа чата!':'Chat wins!'):`${m.prefix??'!'}${s.command} · ${b.hits} ${ru?'ударов':'hits'}`;$('last').textContent=b.lastHit?`${b.lastHit.user} −${b.lastHit.damage}`:'';if(b.hits>hits){$('card').classList.remove('hit');void $('card').offsetWidth;$('card').classList.add('hit')}hits=b.hits}SH.connect('boss',m=>{if(m.type==='boss')render(m)});
</script></body></html>
