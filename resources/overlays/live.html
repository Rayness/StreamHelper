<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>StreamHelper — Live Status</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Montserrat,'Segoe UI',sans-serif;color:#fff}#card{box-sizing:border-box;height:100%;margin:0;padding:21px 28px;border-radius:18px;background:#17131fdd;border:1px solid #ffffff30;display:flex;align-items:center;gap:20px}.dot{width:14px;height:14px;flex:none;border-radius:50%;background:#f54371;box-shadow:0 0 20px #f54371}.body{min-width:0;flex:1}.title{font-size:27px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:18px;color:#d0c8dc;margin-top:6px}.stats{text-align:right;font-size:21px;font-weight:700;white-space:nowrap}.offline .dot{background:#888;box-shadow:none}</style></head><body><div id="card"><div class="dot"></div><div class="body"><div id="title" class="title"></div><div id="category" class="sub"></div></div><div class="stats"><div id="viewers"></div><div id="uptime" class="sub"></div></div></div><script src="/overlay/assets/common.js"></script><script>
const $=id=>document.getElementById(id);let stream=null,lang='ru';function render(){if(!stream)return;const ru=lang==='ru';$('card').classList.toggle('offline',!stream.live);$('title').textContent=stream.title||(ru?'Эфир скоро начнётся':'Stream starting soon');$('category').textContent=stream.categoryName||'StreamHelper';$('viewers').textContent=stream.live?`${stream.viewers} ${ru?'зрителей':'viewers'}`:'';$('uptime').textContent=stream.live&&stream.startedAt?SH.formatClock(Date.now()-stream.startedAt):''}SH.connect('live',m=>{if(m.type==='live'){stream=m.stream;lang=m.lang;render()}});setInterval(render,1000);
</script></body></html>
