<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>StreamHelper — Ads</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Montserrat,'Segoe UI',sans-serif}#ad{position:absolute;width:700px;max-width:calc(100vw - 80px);opacity:0;transform:translateY(25px) scale(.98);transition:opacity .5s,transform .5s;filter:drop-shadow(0 14px 30px #0009)}#ad.show{opacity:1;transform:none}.topLeft{top:40px;left:40px}.topRight{top:40px;right:40px}.bottomLeft{bottom:40px;left:40px}.bottomRight{bottom:40px;right:40px}.art{width:100%;max-height:450px;display:block;object-fit:contain;border-radius:20px;background:#12121a}.copy{display:flex;align-items:center;gap:16px;margin-top:8px;padding:15px 20px;border-radius:14px;background:#14121ded;border-left:5px solid var(--accent);color:#fff}.headline{font-size:30px;font-weight:800;line-height:1.1}.caption{font-size:20px;color:#ddd6e8;line-height:1.3;margin-top:4px}.copy:empty{display:none}
</style></head><body><div id="ad"></div><script src="/overlay/assets/common.js"></script><script>
const root=document.getElementById('ad');let activeId=null;
function render(c){if(!c){root.classList.remove('show');activeId=null;setTimeout(()=>{if(!activeId)root.replaceChildren()},550);return}const changed=activeId!==c.id;activeId=c.id;root.className=c.position;root.style.width=Math.max(200,Math.min(1600,c.width))+'px';root.style.setProperty('--accent',c.accentColor);if(changed){root.replaceChildren();const media=/\.(mp4|webm)(\?|$)/i.test(c.media||'')?document.createElement('video'):document.createElement('img');media.className='art';media.src=c.media;if(media.tagName==='VIDEO'){media.autoplay=true;media.muted=true;media.loop=true;media.playsInline=true;media.play().catch(()=>{})}root.append(media);const copy=document.createElement('div');copy.className='copy';const texts=document.createElement('div');if(c.headline){const h=document.createElement('div');h.className='headline';h.textContent=c.headline;texts.append(h)}if(c.caption){const p=document.createElement('div');p.className='caption';p.textContent=c.caption;texts.append(p)}copy.append(texts);if(texts.childNodes.length)root.append(copy)}requestAnimationFrame(()=>root.classList.add('show'))}
SH.connect('ad',m=>{if(m.type==='ad')render(m.campaign)});
</script></body></html>
