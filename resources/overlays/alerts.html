<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StreamHelper — Alerts</title>
    <style>
      :root {
        --font: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
        --size: 40px;
        --text: #fff;
        --accent: #9b6bff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #stage {
        position: absolute;
        inset: 0;
        font-family: var(--font);
        color: var(--text);
        pointer-events: none;
      }
      .alert-position { position: absolute; }
      .alert {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: 100%;
        max-width: 100%;
        text-align: center;
      }
      .alert.side {
        flex-direction: row;
        text-align: left;
        gap: 24px;
      }
      .media {
        max-width: min(420px, 60vw);
        max-height: 50vh;
        object-fit: contain;
      }
      .alert.side .media { max-width: 45%; flex-shrink: 1; }
      .alert-texts { min-width: 0; max-width: 100%; }
      .alert.side .alert-texts { flex: 1; }
      .title { overflow-wrap: anywhere; }
      .title {
        font-size: var(--size);
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: 0.01em;
        text-shadow:
          0 0 18px color-mix(in srgb, var(--accent) 70%, transparent),
          0 3px 6px rgba(0, 0, 0, 0.7);
        -webkit-text-stroke: 1px rgba(0, 0, 0, 0.25);
      }
      .title .accent {
        color: var(--accent);
      }
      .message {
        font-size: calc(var(--size) * 0.55);
        font-weight: 600;
        max-width: 780px;
        line-height: 1.3;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        overflow-wrap: anywhere;
      }
      .message:empty {
        display: none;
      }

      /* enter / exit animations */
      .fade.enter {
        animation: fadeIn 0.5s ease-out both;
      }
      .fade.exit {
        animation: fadeIn 0.5s ease-in reverse both;
      }
      .slide.enter {
        animation: slideIn 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }
      .slide.exit {
        animation: slideOut 0.5s ease-in both;
      }
      .zoom.enter {
        animation: zoomIn 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.3) both;
      }
      .zoom.exit {
        animation: zoomIn 0.4s ease-in reverse both;
      }
      .bounce.enter {
        animation: bounceIn 0.9s both;
      }
      .bounce.exit {
        animation: fadeIn 0.5s ease-in reverse both;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(60px);
        }
      }
      @keyframes slideOut {
        to {
          opacity: 0;
          transform: translateY(-60px);
        }
      }
      @keyframes zoomIn {
        from {
          opacity: 0;
          transform: scale(0.4);
        }
      }
      @keyframes bounceIn {
        0% {
          opacity: 0;
          transform: scale(0.3);
        }
        50% {
          opacity: 1;
          transform: scale(1.08);
        }
        70% {
          transform: scale(0.95);
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="/overlay/assets/common.js"></script>
    <script>
      const stage = document.getElementById('stage');
      let current = null;
      let audio = null;
      let exitTimer = null;
      let speechTimer = null;
      let layoutFrame = 0;
      let currentStyle = null;

      function fit() {
        layoutFrame = 0;
        if (!current || !currentStyle) return;
        const width = Math.max(10, Math.min(100, Number(currentStyle.width) || 90)) / 100 * stage.clientWidth;
        current.style.width = width + 'px';
        const bounds = SH.alertBounds(stage.clientWidth, stage.clientHeight, width, current.offsetHeight, currentStyle);
        current.style.left = bounds.left + 'px';
        current.style.top = bounds.top + 'px';
        current.style.transform = `scale(${bounds.scale})`;
        current.style.transformOrigin = 'top left';
        if (SH.preview && window.parent !== window) {
          const parts = [...current.querySelectorAll('.title,.message,.media')].map((el) => el.getBoundingClientRect()).filter((r) => r.width && r.height);
          if (parts.length) {
            const x = Math.min(...parts.map((r) => r.left)), y = Math.min(...parts.map((r) => r.top));
            window.parent.postMessage({type:'alertPreviewBounds',bounds:{x,y,width:Math.max(...parts.map((r) => r.right))-x,height:Math.max(...parts.map((r) => r.bottom))-y}}, '*');
          }
        }
      }
      function scheduleFit() { if (!layoutFrame) layoutFrame = requestAnimationFrame(fit); }
      new ResizeObserver(scheduleFit).observe(stage);
      document.fonts?.addEventListener('loadingdone', scheduleFit);

      /** A pleasant two-note chime for alerts without a custom sound. */
      function chime(volume) {
        try {
          const ctx = new AudioContext();
          const gain = ctx.createGain();
          gain.connect(ctx.destination);
          gain.gain.value = 0;
          [
            [880, 0],
            [1318.5, 0.12],
          ].forEach(([freq, at]) => {
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = freq;
            osc.connect(gain);
            osc.start(ctx.currentTime + at);
            osc.stop(ctx.currentTime + at + 0.9);
          });
          gain.gain.linearRampToValueAtTime(0.35 * volume, ctx.currentTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.1);
          setTimeout(() => ctx.close(), 1500);
        } catch {}
      }

      function speak(text, lang) {
        if (!text || !('speechSynthesis' in window)) return;
        const u = new SpeechSynthesisUtterance(text.slice(0, 300));
        u.lang = lang;
        speechSynthesis.speak(u);
      }

      function isVideo(url) {
        return /\.(webm|mp4)$/i.test(url);
      }

      function show(a) {
        clear(true);
        SH.loadFont(a.style.fontFamily);
        const s = document.documentElement.style;
        s.setProperty('--font', SH.fontStack(a.style.fontFamily));
        s.setProperty('--size', a.style.fontSize + 'px');
        s.setProperty('--text', a.style.textColor);
        s.setProperty('--accent', a.style.accentColor);

        const position = SH.el('div', 'alert-position');
        const style = a.style || {};
        const clamp = (value, fallback, min, max) => Math.min(max, Math.max(min, Number.isFinite(Number(value)) ? Number(value) : fallback));
        position.style.width = clamp(style.width, 90, 10, 100) + '%';
        const box = SH.el('div', `alert ${a.animation} enter ${a.style.layout === 'side' ? 'side' : ''}`);
        if (SH.preview) box.classList.remove('enter');
        box.style.padding = clamp(style.padding, 16, 0, 100) + 'px';
        box.style.borderRadius = clamp(style.borderRadius, 16, 0, 100) + 'px';
        box.style.textAlign = ['left', 'center', 'right'].includes(style.textAlign) ? style.textAlign : 'center';
        const bg = /^#[0-9a-f]{6}$/i.test(style.backgroundColor) ? style.backgroundColor : '#15121f';
        box.style.background = bg + Math.round(clamp(style.backgroundOpacity, 0, 0, 100) * 2.55).toString(16).padStart(2, '0');
        if (a.image) {
          const media = isVideo(a.image) ? SH.el('video', 'media') : SH.el('img', 'media');
          media.src = a.image;
          media.style.maxWidth = `min(${clamp(style.imageWidth, 420, 40, 1920)}px, ${style.layout === 'side' ? '45%' : '100%'})`;
          media.style.maxHeight = `min(${clamp(style.imageHeight, 480, 40, 1080)}px, 50vh)`;
          media.addEventListener('load', scheduleFit);
          media.addEventListener('loadedmetadata', scheduleFit);
          if (media.tagName === 'VIDEO') {
            media.autoplay = true;
            media.loop = true;
            media.muted = SH.preview || !!a.sound;
            media.volume = clamp(a.volume, 1, 0, 1);
          }
          box.appendChild(media);
        }
        const texts = SH.el('div', 'alert-texts');
        const title = SH.el('div', 'title');
        // Paint the user's name with the accent color.
        const at = a.userName ? a.title.indexOf(a.userName) : -1;
        if (at === -1) title.textContent = a.title;
        else {
          title.appendChild(document.createTextNode(a.title.slice(0, at)));
          title.appendChild(SH.el('span', 'accent', a.userName));
          title.appendChild(document.createTextNode(a.title.slice(at + a.userName.length)));
        }
        texts.appendChild(title);
        const message = SH.el('div', 'message', a.message);
        message.style.fontSize = clamp(style.messageFontSize, style.fontSize * .55, 10, 120) + 'px';
        texts.appendChild(message);
        box.appendChild(texts);
        position.appendChild(box);
        stage.appendChild(position);
        current = position;
        currentStyle = style;
        fit();

        if (SH.preview) return;

        if (a.sound) {
          audio = new Audio(a.sound);
          audio.volume = clamp(a.volume, 1, 0, 1);
          if (a.tts) audio.onended = () => speak(a.message, document.documentElement.lang);
          audio.play().catch(() => {});
        } else {
          chime(a.volume);
          if (a.tts) speechTimer = setTimeout(() => speak(a.message, document.documentElement.lang), 900);
        }
        exitTimer = setTimeout(() => clear(false), Math.max(1, a.durationSec) * 1000);
      }

      function clear(immediate) {
        if (speechTimer) clearTimeout(speechTimer);
        speechTimer = null;
        if (exitTimer) clearTimeout(exitTimer);
        exitTimer = null;
        if (audio) {
          audio.onended = null;
          audio.pause();
          audio = null;
        }
        if ('speechSynthesis' in window) speechSynthesis.cancel();
        const position = current;
        current = null;
        currentStyle = null;
        if (!position) return;
        position.querySelectorAll('video,audio').forEach((media) => media.pause());
        const box = position.firstElementChild;
        if (immediate || !box) return position.remove();
        box.classList.remove('enter');
        box.classList.add('exit');
        setTimeout(() => position.remove(), 600);
      }

      SH.connect('alerts', (msg) => {
        if (SH.preview) return;
        if (msg.type === 'alert') {
          document.documentElement.lang = /[а-яё]/i.test(msg.alert.title) ? 'ru-RU' : 'en-US';
          show(msg.alert);
        } else if (msg.type === 'alertSkip') clear(false);
      });
      if (SH.preview) window.addEventListener('message', (event) => {
        if (event.source === window.parent && event.data?.type === 'alert') show(event.data.alert);
      });
    </script>
  </body>
</html>
