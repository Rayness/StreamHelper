<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>StreamHelper — Music duel</title>
    <style>
      :root { --accent: #ff5d8f; --b: #3fa7ff; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; color: #fff; }
      #duel { position: absolute; inset: 12px; display: grid; grid-template-columns: 1fr 120px 1fr; align-items: stretch; gap: 0; opacity: 0; transform: scale(0.97); transition: opacity 0.45s, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
      #duel.on { opacity: 1; transform: none; }
      .side { position: relative; display: flex; flex-direction: column; border-radius: 20px; overflow: hidden; background: rgba(13, 11, 20, 0.9); box-shadow: 0 16px 44px rgba(0, 0, 0, 0.45); transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s, filter 0.4s; }
      .side.a { --c: var(--accent); }
      .side.b { --c: var(--b); }
      .side.playing { transform: scale(1.03); box-shadow: 0 0 0 3px var(--c), 0 0 46px color-mix(in srgb, var(--c) 55%, transparent); }
      .side.dim { filter: saturate(0.55) brightness(0.75); }
      .side.lose { filter: grayscale(0.9) brightness(0.55); transform: scale(0.96); }
      .side.win { box-shadow: 0 0 0 4px var(--c), 0 0 70px var(--c); }
      .media { position: relative; flex: 1; min-height: 0; background: #000 center/cover no-repeat; }
      .media .player, .media .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      .eq { position: absolute; left: 14px; bottom: 12px; display: none; gap: 4px; align-items: flex-end; height: 34px; }
      .side.playing .eq { display: flex; }
      .eq i { width: 6px; border-radius: 3px; background: var(--c); animation: eq 0.9s ease-in-out infinite; }
      .eq i:nth-child(2) { animation-delay: -0.3s; } .eq i:nth-child(3) { animation-delay: -0.6s; } .eq i:nth-child(4) { animation-delay: -0.15s; }
      .badge { position: absolute; top: 12px; left: 12px; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; background: var(--c); font-size: 26px; font-weight: 900; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
      .blocked { position: absolute; inset: auto 12px 12px 12px; padding: 8px 12px; border-radius: 10px; background: rgba(10, 8, 14, 0.9); font-size: 15px; font-weight: 700; display: none; }
      .side.failed .blocked { display: block; }
      .crown { position: absolute; top: 6px; right: 14px; font-size: 54px; display: none; animation: drop 0.7s cubic-bezier(0.22, 1, 0.36, 1); }
      .side.win .crown { display: block; }
      .info { padding: 12px 16px 14px; }
      .title { font-size: 21px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .who { font-size: 15px; opacity: 0.75; font-weight: 600; margin-top: 2px; }
      .votes { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
      .track { flex: 1; height: 12px; border-radius: 6px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
      .fill { height: 100%; width: 0; background: var(--c); transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
      .count { min-width: 44px; text-align: right; font-weight: 900; font-size: 20px; font-variant-numeric: tabular-nums; }
      .mid { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
      .vs { font-size: 54px; font-weight: 900; font-style: italic; background: linear-gradient(135deg, var(--accent), var(--b)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 14px rgba(0,0,0,.6)); animation: beat 1.2s ease-in-out infinite; }
      .phase { padding: 6px 10px; border-radius: 999px; background: rgba(12, 10, 18, 0.88); font-size: 13px; font-weight: 800; text-align: center; letter-spacing: 0.04em; }
      .clock { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
      /* Only in a normal browser tab: OBS plays sound without a click. */
      #unlock { position: fixed; inset: 0; z-index: 10; display: none; place-items: center; background: rgba(0, 0, 0, 0.55); color: #fff; font: 800 24px/1.3 system-ui, sans-serif; border: 0; cursor: pointer; }
      #unlock.show { display: grid; }
      @keyframes eq { 0%, 100% { height: 20%; } 50% { height: 100%; } }
      @keyframes beat { 50% { transform: scale(1.12); } }
      @keyframes drop { from { transform: translateY(-40px) rotate(-20deg); opacity: 0; } }
      body.reduced .vs, body.reduced .eq i { animation: none; }
    </style>
  </head>
  <body>
    <button id="unlock" type="button"></button>
    <div id="duel">
      <div class="side a"><div class="media"><div class="player"></div><div class="badge">1</div><div class="crown">👑</div><div class="eq"><i></i><i></i><i></i><i></i></div><div class="blocked"></div></div><div class="info"><div class="title"></div><div class="who"></div><div class="votes"><div class="track"><div class="fill"></div></div><div class="count">0</div></div></div></div>
      <div class="mid"><div class="vs">VS</div><div class="phase"></div><div class="clock"></div></div>
      <div class="side b"><div class="media"><div class="player"></div><div class="badge">2</div><div class="crown">👑</div><div class="eq"><i></i><i></i><i></i><i></i></div><div class="blocked"></div></div><div class="info"><div class="title"></div><div class="who"></div><div class="votes"><div class="track"><div class="fill"></div></div><div class="count">0</div></div></div></div>
    </div>
    <script src="/overlay/assets/common.js"></script>
    <script>
      const root = document.getElementById('duel');
      if (SH.reducedMotion) document.body.classList.add('reduced');
      let d = null, style = null, lang = 'ru', skew = 0, apiReady = false, player = null, playing = '', autoplayTimer = null;
      const failed = new Set();
      const unlock = document.getElementById('unlock');
      let reportedBlock = '';
      unlock.addEventListener('click', () => {
        unlock.classList.remove('show');
        try { player.unMute(); player.setVolume(Math.max(0, Math.min(100, style.volume))); player.playVideo(); } catch (_) {}
      });
      /** Tell the app which track YouTube refused, so the streamer sees why it was silent. */
      function report(videoId, code) {
        fetch('/player/error', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'duel', videoId, code }) }).catch(() => undefined);
      }
      window.onYouTubeIframeAPIReady = () => { apiReady = true; syncPlayer(); };
      if (!SH.preview) { const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); }

      function stopPlayer() {
        clearTimeout(autoplayTimer);
        if (player) { try { player.destroy(); } catch (_) { /* still loading */ } }
        player = null; playing = '';
        root.querySelectorAll('.player').forEach((p) => p.replaceChildren());
      }
      /** The side that is on air gets a live YouTube player inside its card. */
      function syncPlayer() {
        if (SH.preview || !d) return;
        const key = d.status === 'playingA' ? 'a' : d.status === 'playingB' ? 'b' : '';
        const side = key ? d[key] : null;
        const id = side ? key + ':' + side.videoId : '';
        if (id === playing) return;
        stopPlayer();
        if (!side || !apiReady) return;
        playing = id;
        const host = document.createElement('div');
        root.querySelector('.side.' + key + ' .player').appendChild(host);
        const videoId = side.videoId;
        player = new YT.Player(host, { width: '100%', height: '100%', videoId, playerVars: { autoplay: 1, controls: 0, playsinline: 1, start: Math.max(0, style.startOffsetSec | 0), origin: location.origin }, events: {
          onReady: (e) => {
            e.target.unMute();
            e.target.setVolume(Math.max(0, Math.min(100, style.volume)));
            e.target.playVideo();
            // A normal browser (not OBS) blocks sound without a click: play muted rather than not at all.
            clearTimeout(autoplayTimer);
            autoplayTimer = setTimeout(() => {
              try {
                const st = e.target.getPlayerState();
                if (!e.target.isMuted() && (st === YT.PlayerState.PLAYING || st === YT.PlayerState.BUFFERING)) return;
                // Play muted rather than not at all, and offer the click that unlocks sound.
                e.target.mute(); e.target.playVideo();
                unlock.textContent = SH.tr(lang, '🔊 Нажмите, чтобы включить звук (в OBS этого не нужно)', '🔊 Click to enable sound (not needed in OBS)');
                unlock.classList.add('show');
                if (reportedBlock !== id) { reportedBlock = id; report(videoId, 0); }
              } catch (_) {}
            }, 2500);
          },
          onError: (e) => { failed.add(key + ':' + videoId); report(videoId, e.data); render(); },
        } });
      }
      function tick() {
        if (!d) return;
        root.querySelector('.clock').textContent = d.endsAt && d.status !== 'done' ? SH.formatClock(d.endsAt - (Date.now() + skew)) : '';
      }
      function render() {
        root.classList.toggle('on', d.status !== 'idle');
        const phase = { playingA: SH.tr(lang, 'Трек 1', 'Track 1'), playingB: SH.tr(lang, 'Трек 2 · голосуйте!', 'Track 2 · vote!'), voting: SH.tr(lang, 'Пишите 1 или 2', 'Type 1 or 2'), done: d.winner === 'tie' ? SH.tr(lang, 'Ничья!', 'A tie!') : SH.tr(lang, 'Победитель!', 'Winner!') }[d.status] || '';
        root.querySelector('.phase').textContent = phase;
        const total = (d.a?.votes || 0) + (d.b?.votes || 0);
        for (const key of ['a', 'b']) {
          const s = d[key];
          const el = root.querySelector('.side.' + key);
          if (!s) continue;
          el.querySelector('.media').style.backgroundImage = `url(https://i.ytimg.com/vi/${encodeURIComponent(s.videoId)}/hqdefault.jpg)`;
          el.querySelector('.title').textContent = s.title;
          el.querySelector('.who').textContent = SH.tr(lang, 'заказ: ', 'requested by ') + s.userName;
          el.querySelector('.count').textContent = s.votes;
          el.querySelector('.fill').style.width = (total ? (s.votes / total) * 100 : 0) + '%';
          const on = (key === 'a' && d.status === 'playingA') || (key === 'b' && d.status === 'playingB');
          el.classList.toggle('playing', on && !failed.has(key + ':' + s.videoId));
          el.classList.toggle('failed', failed.has(key + ':' + s.videoId));
          el.querySelector('.blocked').textContent = SH.tr(lang, '⚠ YouTube не даёт проиграть этот трек', '⚠ YouTube refuses to play this track');
          el.classList.toggle('dim', (d.status === 'playingA' || d.status === 'playingB') && !on);
          el.classList.toggle('win', d.status === 'done' && d.winner === key);
          el.classList.toggle('lose', d.status === 'done' && d.winner !== key && d.winner !== 'tie');
        }
      }

      SH.connect('duel', (msg) => {
        if (msg.type !== 'duel') return;
        d = msg.duel; style = msg.style; lang = msg.lang; skew = msg.now - Date.now();
        if (d.status === 'idle') failed.clear();
        if (SH.preview && d.status === 'idle') {
          d = { status: 'playingB', endsAt: Date.now() + 14000, winner: null, a: { requestId: 'a', videoId: 'dQw4w9WgXcQ', title: SH.tr(lang, 'Трек первого зрителя', "First viewer's track"), userName: 'Viewer_1', votes: 12 }, b: { requestId: 'b', videoId: 'kJQP7kiw5Fk', title: SH.tr(lang, 'Трек второго зрителя', "Second viewer's track"), userName: 'Viewer_2', votes: 9 } };
          skew = 0;
        }
        SH.useFont(root, style.fontFamily);
        root.style.setProperty('--accent', style.accentColor);
        render();
        syncPlayer();
        tick();
      });
      setInterval(tick, 250);
    </script>
  </body>
</html>
