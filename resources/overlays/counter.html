<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StreamHelper — Counter</title>
    <style>
      :root {
        --accent: #ff5d8f;
        --text: #fff;
        --size: 44px;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
      #counter {
        display: none;
        align-items: center;
        gap: 0.45em;
        margin: 10px;
        color: var(--text);
        font-size: var(--size);
        font-weight: 800;
        line-height: 1.1;
      }
      #counter.on {
        display: inline-flex;
      }
      .value {
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        display: inline-block;
      }
      .value.bump {
        animation: bump 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .card {
        padding: 0.3em 0.6em;
        border-radius: 0.35em;
        background: rgba(12, 12, 18, 0.84);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        border-left: 0.12em solid var(--accent);
      }
      .minimal {
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      }
      .badge .title {
        padding: 0.2em 0.5em;
        border-radius: 999px;
        background: rgba(12, 12, 18, 0.84);
        font-size: 0.6em;
      }
      .badge .value {
        min-width: 1.6em;
        padding: 0.12em 0.4em;
        border-radius: 999px;
        text-align: center;
        background: var(--accent);
        color: #fff;
      }
      @keyframes bump {
        40% {
          transform: scale(1.3);
        }
      }
    </style>
  </head>
  <body>
    <div id="counter"><span class="title"></span><span class="value"></span></div>
    <script src="/overlay/assets/common.js"></script>
    <script>
      const root = document.getElementById('counter');
      const valueEl = root.querySelector('.value');
      let last = null;

      SH.connect('counter', (msg) => {
        if (msg.type !== 'counter') return;
        const c = msg.counter;
        root.classList.toggle('on', !!c);
        if (!c) return;
        root.className = `on ${c.style}`;
        SH.useFont(root, c.fontFamily);
        root.style.setProperty('--accent', c.accentColor);
        root.style.setProperty('--text', c.textColor);
        root.style.setProperty('--size', c.fontSize + 'px');
        root.querySelector('.title').textContent = c.title;
        const value = SH.preview && c.value === 0 ? 7 : c.value;
        valueEl.textContent = value;
        if (last !== null && last !== value) {
          valueEl.classList.remove('bump');
          void valueEl.offsetWidth;
          valueEl.classList.add('bump');
        }
        last = value;
      });
    </script>
  </body>
</html>
