<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StreamHelper — Timer</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
      #timer {
        display: none;
        flex-direction: column;
        align-items: center;
        padding: 10px;
        color: #fff;
        text-shadow: 0 3px 8px rgba(0, 0, 0, 0.75);
      }
      #timer.visible {
        display: inline-flex;
      }
      .title {
        font-weight: 700;
        font-size: 0.35em;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.9;
      }
      .title:empty {
        display: none;
      }
      .clock {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        line-height: 1.05;
      }
      .bump {
        animation: bump 0.6s ease-out;
      }
      @keyframes bump {
        30% {
          transform: scale(1.12);
          color: #7dffb0;
        }
      }
    </style>
  </head>
  <body>
    <div id="timer"><div class="title"></div><div class="clock">00:00</div></div>
    <script src="/overlay/assets/common.js"></script>
    <script>
      const root = document.getElementById('timer');
      const clock = root.querySelector('.clock');
      let timer = null;
      let skew = 0;
      let lastValue = null;

      function value(now) {
        if (!timer.running || timer.anchorAt === null) return timer.pausedMs;
        return timer.mode === 'countdown' ? Math.max(0, timer.anchorAt - now) : now - timer.anchorAt;
      }

      function tick() {
        if (!timer) return;
        clock.textContent = SH.formatClock(value(Date.now() + skew));
      }

      SH.connect('timer', (msg) => {
        if (msg.type !== 'timer') return;
        const prev = timer ? value(Date.now() + skew) : null;
        timer = msg.timer;
        skew = msg.now - Date.now();
        root.classList.toggle('visible', !!timer);
        if (!timer) return;
        SH.loadFont(timer.fontFamily);
        root.style.fontFamily = SH.fontStack(timer.fontFamily);
        root.style.fontSize = timer.fontSize + 'px';
        root.style.color = timer.textColor;
        root.querySelector('.title').textContent = timer.title;
        // Celebrate time being added (subathon).
        const now = value(Date.now() + skew);
        if (prev !== null && timer.mode === 'countdown' && now - prev > 1500) {
          clock.classList.remove('bump');
          void clock.offsetWidth;
          clock.classList.add('bump');
        }
        tick();
      });
      setInterval(tick, 250);
    </script>
  </body>
</html>
